<div id="mainContainer">
    <div id="mapNavigatorContainer" class="flexrows">
    <!-- Event to handle bounding box search-->
    <mp-event-proxy
      id="on-moveend-search-map"
      on-event-source="search-map"
      on-event-type="SemanticMap.BoundingBoxChanged"
      proxy-event-type="SemanticSearch.QueryConstant.SetParameters"
      proxy-targets='["search-map-query"]'
    >
    </mp-event-proxy>

    <!-- Structured search with geospatial -->
    <semantic-context repository="ephedra">
      <semantic-search
        search-profile='{
          "categories": [{
            "iri": "<https://veniss.net/veniss_ontology#Event>",
            "label": "Event",
            "thumbnail": "../../assets/icons/Event.svg"
          },
          {
            "iri": "<https://veniss.net/veniss_ontology#Builtwork>",
            "label": "Builtwork",
            "thumbnail": "../../assets/icons/Builtwork.svg"
          }],
          "relations": [{
            "iri": "<https://veniss.net/veniss_ontology#related_to>",
            "label": "Related to",
            "hasDomain": "<https://veniss.net/veniss_ontology#Event>",
            "hasRange": "<https://veniss.net/veniss_ontology#Builtwork>"
          }]
        }'
      >

        <semantic-search-query-constant

          id="search-map-query"
          parameters='{
            "southWestLat": {"value": "1369976.3700049379840493"},
            "southWestLon": {"value": "5685579.3808039482682943"},
            "northEstLat": {"value": "1377990.9423133304808289"},
            "northEstLon": {"value": "5692943.0214672936126590"},
            "date": {"value": "1801-01-01"}
          }'
          query='
            SELECT DISTINCT ?subject ?bw_id ?wkt ?t ?z ?bob ?eoe WHERE {
                service <http://www.researchspace.org/resource/system/repository/federation#geosql> {
                    ?root rs_sql_sail:hasQueryId "production";	
                    veniss_sql:minX ?southWestLat;
                    veniss_sql:minY ?southWestLon;
                    veniss_sql:maxX ?northEstLat;
                    veniss_sql:maxY ?northEstLon;

                    veniss_sql:wkt ?wkt;
                    veniss_sql:bw_id ?bw_id;
                    veniss_sql:t ?t;
                    veniss_sql:z ?z;
                }
            }'
        ></semantic-search-query-constant>

        <semantic-search-result-holder>
          <div id="mapNavigatorRow">
            <semantic-map-controls
            id="search-map-control"
            target-map-id="search-map"
            features-taxonomies="name,use"
            features-color-taxonomies="use,function"
            features-colors-palette='{
              "military":"rgba(245,185,153,0.6)",
              "service":"rgba(124,164,204,0.6)",
              "abandoned":"rgba(183,161,209,0.6)",
              "religious":"rgba(0,63,114,0.6)",
              "water supply":"rgba(154,207,237)",
              "accomodation":"rgba(214,223,218,0.6)",
              "unknown":"rgba(173,195,165,0.6)",
              "kennel":"rgba(100,195,165,0.6)"
            }'
            features-options-enabled="true"
            filters-initialization='{"basemap":true,"overlay":true,"feature":true}'
            vector-levels='["Island","Buildings"]'
            show-filters="false"
            spatial-filter-default="true"
            temporal-filter-default="false"
            spatial-filter-label="Filter by zoom"
            temporal-filter-label="Filter by time"
            sync-filter-default="false"
            sync-filter-label="Sync with time"
            snap-filter-default="true"
            snap-filter-label="Snap to map years"
            time-filter-mode="snapshot"
            related-min-zoom="15"
            timeline='{
              "min":1500,
              "mode":"normal",
              "default":2026
            }'
            >
              <!-- Related entities. Each class carries its own query, its own spatial pattern and
                   its own templates: the map component knows nothing about VeNiSS.
                   Contract: project ?entity and a numeric ?year, order by ?year, and mark where
                   the spatial restriction belongs with FILTER(?__spatial__). -->

              <related-entities-class
                id="sources" label="Sources" icon="fa fa-file-text-o" limit="300"
                query='
                  PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
                  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                  PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                  PREFIX veniss_ontology: <https://veniss.net/ontology#>

                  SELECT DISTINCT ?entity ?year WHERE {
                    ?entity a veniss_ontology:Source ;
                            crm:P108i_was_produced_by ?production .
                    ?production crm:P4_has_time-span ?timespan .
                    ?timespan crm:P170i_time_is_defined_by ?primitive .
                    ?primitive crm:P2_has_type <https://veniss.net/resource/type/time_primitive_year> ;
                               rdfs:label ?year_label .
                    FILTER(REGEX(STR(?year_label), "^[0-9]{3,4}$"))
                    BIND(xsd:integer(STR(?year_label)) AS ?year)
                    FILTER(?__spatial__)
                  }
                  ORDER BY ?year'
                spatial-pattern='
                  ?entity <https://veniss.net/ontology#has_island> ?island .
                  ?island <http://www.cidoc-crm.org/cidoc-crm/P87_is_identified_by> ?lat_node .
                  ?lat_node <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <https://veniss.net/ontology#latitude> ;
                            <http://www.w3.org/2000/01/rdf-schema#label> ?lat .
                  ?island <http://www.cidoc-crm.org/cidoc-crm/P87_is_identified_by> ?lng_node .
                  ?lng_node <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <https://veniss.net/ontology#longitude> ;
                            <http://www.w3.org/2000/01/rdf-schema#label> ?lng .
                  FILTER(
                    xsd:double(STR(?lng)) >= xsd:double(STR(?__minLon__)) &&
                    xsd:double(STR(?lng)) <= xsd:double(STR(?__maxLon__)) &&
                    xsd:double(STR(?lat)) >= xsd:double(STR(?__minLat__)) &&
                    xsd:double(STR(?lat)) <= xsd:double(STR(?__maxLat__))
                  )'>
                <template id='row'>[[> veniss:RelatedRow]]</template>
                <template id='detail'>[[> veniss:RelatedDetail]]</template>
              </related-entities-class>

              <related-entities-class
                id="events" label="Events" icon="fa fa-calendar" limit="300"
                query='
                  PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
                  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                  PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                  PREFIX veniss_ontology: <https://veniss.net/ontology#>

                  SELECT DISTINCT ?entity ?year WHERE {
                    ?entity a veniss_ontology:Event ;
                            crm:P4_has_time-span ?timespan .
                    ?timespan crm:P170i_time_is_defined_by ?primitive .
                    ?primitive crm:P2_has_type <https://veniss.net/resource/type/time_primitive_year> ;
                               rdfs:label ?year_label .
                    FILTER(REGEX(STR(?year_label), "^[0-9]{3,4}$"))
                    BIND(xsd:integer(STR(?year_label)) AS ?year)
                    FILTER(?__spatial__)
                  }
                  ORDER BY ?year'
                spatial-pattern='
                  ?entity <https://veniss.net/ontology#has_island> ?island .
                  ?island <http://www.cidoc-crm.org/cidoc-crm/P87_is_identified_by> ?lat_node .
                  ?lat_node <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <https://veniss.net/ontology#latitude> ;
                            <http://www.w3.org/2000/01/rdf-schema#label> ?lat .
                  ?island <http://www.cidoc-crm.org/cidoc-crm/P87_is_identified_by> ?lng_node .
                  ?lng_node <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <https://veniss.net/ontology#longitude> ;
                            <http://www.w3.org/2000/01/rdf-schema#label> ?lng .
                  FILTER(
                    xsd:double(STR(?lng)) >= xsd:double(STR(?__minLon__)) &&
                    xsd:double(STR(?lng)) <= xsd:double(STR(?__maxLon__)) &&
                    xsd:double(STR(?lat)) >= xsd:double(STR(?__minLat__)) &&
                    xsd:double(STR(?lat)) <= xsd:double(STR(?__maxLat__))
                  )'>
                <template id='row'>[[> veniss:RelatedRow]]</template>
                <template id='detail'>[[> veniss:RelatedDetail]]</template>
              </related-entities-class>

              <!-- People have no direct link to an island: they are reached through the sources
                   they authored, and they are dated by that source's production year. Measured on
                   the live data: 260 authors are reachable from an island, and *none* of them has
                   a birth event — dating people by birth empties the tab entirely.
                   ?production is bound by the spatial pattern, so the two stay in step. -->
              <related-entities-class
                id="people" label="People" icon="fa fa-user" limit="300"
                query='
                  PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
                  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                  PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                  PREFIX crmpc: <http://www.cidoc-crm.org/crmpc/>

                  SELECT DISTINCT ?entity ?year WHERE {
                    FILTER(?__spatial__)
                    ?production crm:P4_has_time-span ?timespan .
                    ?timespan crm:P170i_time_is_defined_by ?primitive .
                    ?primitive crm:P2_has_type <https://veniss.net/resource/type/time_primitive_year> ;
                               rdfs:label ?year_label .
                    FILTER(REGEX(STR(?year_label), "^[0-9]{3,4}$"))
                    BIND(xsd:integer(STR(?year_label)) AS ?year)
                  }
                  ORDER BY ?year'
                spatial-pattern='
                  ?actor_role <http://www.cidoc-crm.org/crmpc/P02_has_range> ?entity ;
                              <http://www.cidoc-crm.org/crmpc/P01_has_domain> ?production .
                  ?authored <http://www.cidoc-crm.org/cidoc-crm/P108i_was_produced_by> ?production ;
                            <https://veniss.net/ontology#has_island> ?island .
                  ?island <http://www.cidoc-crm.org/cidoc-crm/P87_is_identified_by> ?lat_node .
                  ?lat_node <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <https://veniss.net/ontology#latitude> ;
                            <http://www.w3.org/2000/01/rdf-schema#label> ?lat .
                  ?island <http://www.cidoc-crm.org/cidoc-crm/P87_is_identified_by> ?lng_node .
                  ?lng_node <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <https://veniss.net/ontology#longitude> ;
                            <http://www.w3.org/2000/01/rdf-schema#label> ?lng .
                  FILTER(
                    xsd:double(STR(?lng)) >= xsd:double(STR(?__minLon__)) &&
                    xsd:double(STR(?lng)) <= xsd:double(STR(?__maxLon__)) &&
                    xsd:double(STR(?lat)) >= xsd:double(STR(?__minLat__)) &&
                    xsd:double(STR(?lat)) <= xsd:double(STR(?__maxLat__))
                  )'>
                <template id='row'>[[> veniss:RelatedRow]]</template>
                <template id='detail'>[[> veniss:RelatedDetail]]</template>
              </related-entities-class>

              <!-- Builtworks are the only class that is literally in the bounding box, so this one
                   goes through the geosql service and uses the EPSG:3857 variables. -->
              <related-entities-class
                id="builtworks" label="Builtworks" icon="fa fa-university" limit="300"
                query='
                  PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
                  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                  PREFIX crm: <http://www.cidoc-crm.org/cidoc-crm/>
                  PREFIX veniss_sql: <http://www.researchspace.org/resource/system/service/veniss_sql#>
                  PREFIX rs_sql_sail: <http://www.researchspace.org/resource/system/sql#>

                  SELECT DISTINCT ?entity ?year WHERE {
                    FILTER(?__spatial__)
                    ?representation crm:P2_has_type <https://veniss.net/ontology#2d_representation> ;
                                    rdfs:label ?bw_id .
                    ?phase crm:P138i_has_representation ?representation ;
                           crm:P4_has_time-span ?phase_timespan .
                    ?physical_changes crm:P166i_had_presence ?phase .
                    ?entity crm:P196i_is_defined_by ?physical_changes .
                    ?phase_timespan crm:P82a_begin_of_the_begin ?bob .
                    FILTER(STRSTARTS(STR(?bob), "http://") = false)
                    BIND(xsd:integer(STRBEFORE(STR(?bob), "-")) AS ?year)
                    FILTER(BOUND(?year))
                  }
                  ORDER BY ?year'
                spatial-pattern='
                  SERVICE <http://www.researchspace.org/resource/system/repository/federation#geosql> {
                    ?geo <http://www.researchspace.org/resource/system/sql#hasQueryId> "production" ;
                         <http://www.researchspace.org/resource/system/service/veniss_sql#minX> ?__minX__ ;
                         <http://www.researchspace.org/resource/system/service/veniss_sql#minY> ?__minY__ ;
                         <http://www.researchspace.org/resource/system/service/veniss_sql#maxX> ?__maxX__ ;
                         <http://www.researchspace.org/resource/system/service/veniss_sql#maxY> ?__maxY__ ;
                         <http://www.researchspace.org/resource/system/service/veniss_sql#bw_id> ?bw_id .
                  }'>
                <template id='row'>[[> veniss:RelatedRow]]</template>
                <template id='detail'>[[> veniss:RelatedDetail]]</template>
              </related-entities-class>

          </semantic-map-controls>
            <div id="mapContainer">[[> veniss:Map ]]</div>
          </div>
        </semantic-search-result-holder>
      </semantic-search>
    </semantic-context>
  </div>
</div>


<style>
  /* Fix scroll issue - ensure map fits viewport */
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  
  #mainContainer {
    height: calc(100vh - var(--nav-height, 58px));
    overflow: hidden;
  }
  
  #mapNavigatorContainer {
    height: 100%;
    overflow: hidden;
  }
  
  #mapNavigatorRow {
    height: 100%;
    overflow: hidden;
  }
  
  #mapContainer {
    height: 100%;
    overflow: hidden;
  }

  #sideNavbar {
    display: block !important;
  }

  #centralNavbar {
    display: none !important;
  }

  .colorsLegend {
    position: fixed;
    right: calc(var(--sidebar-width) + 20px) !important;
    top: 120px;
    left: auto !important;
    background-color: white;
    border-radius: 5px;
    z-index: 100000000;
    padding: 10px;
}

  #veniss_navbar {
  width: 100%;
  min-height: var(--nav-height, 58px);
    height: var(--nav-height, 58px);
    border: none;
    font-size: 14px;
    margin-bottom: 0px;
    background-color: var(--color-navbar-bg, #1d0a6e);
   z-index: 1030;
   right: 0;
   color: white !important;
   -webkit-box-shadow: -5px 0px 5px 0px rgba(0,0,0,0.15); 
   box-shadow: -5px 0px 5px 0px rgba(0,0,0,0.15);
}

.clonedNavbar:nth-child(2){
  display: none !important;
}
#veniss_navbar > li > a {
  font-weight: 300;
}

#veniss_navbar > #main-header-dropdown, .rs-application .navbar-default a#rs-account-dropdown {
  font-family: "Roboto", sans-serif, sans-serif;
  font-size: 13.5px;
  background-color: transparent;
  font-weight: 300;
}

.btn.btn-default.component-page-toolbar__btn_edit {
  display: none !important;
}
</style>
